{{- if and (eq .Values.kind "Deployment") .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dynamic-workload.fullname" . }}
  labels:
    {{- include "dynamic-workload.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dynamic-workload.selectorLabels" . | nindent 4 }}
{{- end }}