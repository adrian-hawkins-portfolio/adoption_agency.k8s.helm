{{- if and (eq .Values.kind "Deployment") .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.image.repository }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.image.repository }}-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.image.repository }}.minikube.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Values.image.repository }}-svc
              port:
                number: {{ $.Values.port }}
{{- end }}