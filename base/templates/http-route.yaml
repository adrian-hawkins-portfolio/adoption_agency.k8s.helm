{{- if and (eq .Values.kind "Deployment") .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.image.repository }}-httproute
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.image.repository }}-httproute
spec:
  parentRefs:
    - name: gateway-api
      namespace: default
  hostnames:
    - {{ .Values.image.repository }}.minikube.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.image.repository }}-svc
          port: {{ $.Values.port }}
{{- end }}
