controller:
  # jenkinsUriPrefix: "/jenkins-devops"
  admin:
    username: admin
    password: mySuperSecretPassword
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.minikube.local
    
    # Let the chart handle the backend (recommended)
    paths: []
    
    # Optional: force v1 if needed
    # apiVersion: "networking.k8s.io/v1"