apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-helm-agent
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-helm-cluster-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-helm-agent-binding
subjects:
  - kind: ServiceAccount
    name: jenkins-helm-agent
    namespace: jenkins
roleRef:
  kind: ClusterRole
  name: jenkins-helm-cluster-admin
  apiGroup: rbac.authorization.k8s.io