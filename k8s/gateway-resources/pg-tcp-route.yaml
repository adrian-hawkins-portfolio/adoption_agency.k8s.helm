apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: postgres
  namespace: prod
spec:
  parentRefs:
    - name: gateway-api
      namespace: default
      sectionName: postgres-tcp
  rules:
    - backendRefs:
        - name: postgresql  # verify with `kubectl get svc -n prod`
          port: 5432