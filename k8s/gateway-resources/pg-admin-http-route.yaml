apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgadmin
  namespace: database
spec:
  parentRefs:
    - name: gateway-api
      namespace: default
  hostnames:
    - pgadmin.minikube.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pgadmin-pgadmin4 
          port: 80