apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod
resources:
  - database/
  - jenkins/
  - observability/
  - rabbitmq/
  # - services/

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: set-prod-namespace
    namespace: prod
    unsetOnly: true          # only set namespace if it is currently empty